# Для серверов, где 80/443 уже занимает nginx хоста (Caddy из compose тогда не поднимаем).
# Установка под root:
#   cp deploy/nginx-krynel.conf /etc/nginx/sites-available/krynel.conf
#   sed -i "s/__DOMAIN__/$(grep ^DOMAIN= .env | cut -d= -f2-)/" /etc/nginx/sites-available/krynel.conf
#   ln -sf ../sites-available/krynel.conf /etc/nginx/sites-enabled/krynel.conf
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d <DOMAIN> --redirect
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
